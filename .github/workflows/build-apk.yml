name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: "Android project ZIP (must be in the repo root)"
        required: true
        default: "specboard_specsync-keyboard_FIXED.zip"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q "${{ github.event.inputs.project_zip }}" -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          SETTINGS=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        # Do NOT force an old version – let the project's wrapper decide

      - name: Make gradlew executable
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "No gradlew found – generating wrapper with Gradle 9.3.1"
            gradle wrapper --gradle-version 9.3.1
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find . -name "*.apk" || true
            exit 1
          fi
          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpecBoard-debug-apk
          path: \( {{ steps.locate.outputs.project_dir }}/ \){{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
